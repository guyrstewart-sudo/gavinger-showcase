<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fractal Dive — 4K Trial Film · Gavinger</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="media/favicon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --ink:#E9E6DF; --muted:#8F8C84; --accent:#ffc93c;
    --serif:'Cormorant', Georgia, serif; --sans:'Instrument Sans', system-ui, sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; color:var(--ink); font-family:var(--sans); overflow:hidden; height:100vh; }
  #film { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #overlay {
    position:fixed; inset:0; z-index:10; display:grid; place-items:center;
    background:rgba(0,0,0,.9); cursor:pointer; border:0; color:var(--ink);
    transition:opacity .8s ease;
  }
  #overlay.gone { opacity:0; pointer-events:none; }
  .inner { text-align:center; }
  .wm { font:300 clamp(2rem,6vw,4.5rem)/1 var(--serif); letter-spacing:.22em; color:transparent; -webkit-text-stroke:1px rgba(233,230,223,.35); }
  .pill {
    display:inline-block; margin-top:2rem; font:500 .8125rem/1 var(--sans); letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink); border:1px solid rgba(233,230,223,.35);
    border-radius:999px; padding:.9em 2.4em; background:transparent;
  }
  .note { display:block; margin-top:1.2rem; font:italic 400 .85rem/1.5 var(--serif); color:var(--muted); }
  #foot {
    position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); z-index:5;
    font:500 .625rem/1 var(--sans); letter-spacing:.32em; text-transform:uppercase;
    color:var(--muted); opacity:.7; pointer-events:none;
  }
</style>
</head>
<body>
<video id="film" playsinline preload="auto" loop muted></video>
<p id="foot">GAVINGER · THE FRACTAL DIVE · 4K TRIAL — ONE CONTINUOUS FILM</p>
<button id="overlay"><span class="inner"><span class="wm">GAVINGER</span><br><span class="pill">Begin the dive &rarr;</span><span class="note">one continuous film &middot; four of ten seams &middot; 59 seconds &middot; loops &middot; best fullscreen</span></span></button>
<script>
(function () {
  var film = document.getElementById('film');
  var overlay = document.getElementById('overlay');
  // serve the 4K master to screens that can use it, 1080p elsewhere
  var big = (screen.width * (devicePixelRatio || 1)) >= 2400;
  film.src = big ? 'media/trial/film-4k.mp4' : 'media/trial/film-1080.mp4';
  overlay.addEventListener('click', function () {
    overlay.classList.add('gone');
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
    film.play().catch(function () {});
  });
  film.addEventListener('click', function () {
    if (film.paused) film.play(); else film.pause();
  });
})();
</script>
</body>
</html>
